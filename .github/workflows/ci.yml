name: CI

on:
  push:
  pull_request:

# The team's toolchain. Keep in step with README.md, "Build and run".
env:
  ALIRE_VERSION: 2.1.1
  ALIRE_TOOLCHAIN: gnat_native=16.1.0 gprbuild

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-latest: GNAT 16.1.0 targets darwin24 and its
        # link fails against the macOS 26 SDK ("unknown architecture
        # arm64e.x1-macos" in libSystem.tbd).
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v6
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.ALIRE_TOOLCHAIN }}

      - name: Build library
        run: alr -n build

      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests

      # No terminal in CI: the showcase draws one frame and prints it.
      - name: Showcase snapshot
        run: |
          cd showcase
          alr -n build
          ./bin/showcase --snapshot | tee snapshot.txt

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.os }}
          path: showcase/snapshot.txt

  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v6
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.ALIRE_TOOLCHAIN }}

      # Every SPARK unit of thuja proves. Keep it that way: an unproved
      # check fails the build.
      - name: SPARK proof
        run: |
          alr -n build
          alr -n with gnatprove
          alr -n exec -- gnatprove -P thuja.gpr --mode=all --checks-as-errors=on
